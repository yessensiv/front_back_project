<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Резюме</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Команда программистов</h1>
  <p class="subtitle">Нажмите на карточку любого участника, чтобы открыть его резюме</p>

  <div class="team-container">
    <div class="card" onclick="openResume(0)">
      <div class="photo-box">
        <img src="/assets/Nurdaulet.jpeg" alt="Фото 1">
      </div>
      <div class="name-box">Есенсары Нұрдаулет</div>
    </div>

    <div class="card" onclick="openResume(1)">
      <div class="photo-box">
        <img src="/assets/Dana.jpeg" alt="Фото 2">
      </div>
      <div class="name-box">Жусупова Дана</div>
    </div>

    <div class="card" onclick="openResume(2)">
      <div class="photo-box">
        <img src="/assets/Asylkhan.jpeg" alt="Фото 3">
      </div>
      <div class="name-box">Әмірхан Асылхан</div>
    </div>
  </div>
 
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeResume()">&times;</span>
      <h2 id="resumeName"></h2>
      <p id="resumeRole" class="role"></p>
      
      <h3>О себе</h3>
      <p id="resumeAbout"></p>

      <h3>Навыки</h3>
      <ul id="resumeSkills"></ul>

      <h3>Опыт работы</h3>
      <p id="resumeExperience"></p>

      <h3>Контакты</h3>
      <p id="resumeContacts"></p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
